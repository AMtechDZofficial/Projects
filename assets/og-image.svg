<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="AMtechDZ — Dépannage et maintenance informatique à domicile, Chlef">
  <defs>
    <linearGradient id="ogTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="ogGlow" cx="0.85" cy="0.15" r="0.6">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fond -->
  <rect width="1200" height="630" fill="#0b1220"/>
  <rect width="1200" height="630" fill="url(#ogGlow)"/>
  <rect x="0" y="0" width="1200" height="10" fill="url(#ogTile)"/>

  <!-- Logo : marque + wordmark -->
  <g transform="translate(80 70)">
    <g transform="scale(1.15)">
      <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#ogTile)"/>
      <path d="M19 46 L32 17 L45 46" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24.5 36 H39.5" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="47" cy="18" r="3.5" fill="#eafff9"/>
    </g>
    <text x="92" y="52" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      <tspan fill="#ffffff">AMtech</tspan><tspan fill="#2dd4bf">DZ</tspan>
    </text>
  </g>

  <!-- Titre -->
  <text x="80" y="290" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Dépannage &amp; maintenance</text>
  <text x="80" y="366" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">
    <tspan fill="#ffffff">informatique </tspan><tspan fill="#2dd4bf">à domicile</tspan>
  </text>

  <!-- Sous-titre -->
  <text x="80" y="430" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="30" font-weight="500" fill="#9fb0c9">Particuliers &amp; petites entreprises · Chlef et environs</text>

  <!-- Bas : téléphone + chips -->
  <g transform="translate(80 500)">
    <rect x="0" y="0" width="300" height="62" rx="14" fill="url(#ogTile)"/>
    <text x="150" y="41" text-anchor="middle" font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="28" font-weight="700" fill="#04211c">📞 07 93 97 93 81</text>
  </g>

  <!-- Chips de services -->
  <g font-family="'Inter','Segoe UI',Arial,sans-serif" font-size="20" font-weight="600" fill="#cdd9ec">
    <g transform="translate(410 500)">
      <rect width="170" height="28" rx="14" fill="#15213a"/>
      <text x="85" y="19" text-anchor="middle">Réseau &amp; Wi-Fi</text>
    </g>
    <g transform="translate(410 534)">
      <rect width="210" height="28" rx="14" fill="#15213a"/>
      <text x="105" y="19" text-anchor="middle">Récupération de données</text>
    </g>
    <g transform="translate(596 500)">
      <rect width="150" height="28" rx="14" fill="#15213a"/>
      <text x="75" y="19" text-anchor="middle">Sécurité</text>
    </g>
  </g>
</svg>
